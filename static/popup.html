<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormGuard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><span class="mark">FG</span><h1>FORMGUARD</h1></header>
      <section><span class="eyebrow">Protection</span><strong id="site-status">Checking…</strong></section>
      <section><span class="eyebrow">Drafts</span><strong id="draft-count">0 saved</strong></section>
      <section><span class="eyebrow">Storage</span><strong>Local device only</strong></section>
      <button id="manage-drafts" class="primary" type="button">Manage Drafts</button>
      <button id="site-toggle" class="secondary" type="button" hidden>Disable on this website</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

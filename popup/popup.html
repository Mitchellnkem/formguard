<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FormGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

    <header><img class="mark" src="../icons/48.png" alt=""><h1>FORMGUARD</h1></header>
